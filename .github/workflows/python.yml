name: Pipeline checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      RUN_ML_TESTS: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install core and developer tools
        run: python -m pip install -e . -r requirements-dev.txt
      - run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Core tests without ML dependencies
        run: python -m unittest discover -s tests -v

  synthetic-runtime:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RUN_ML_TESTS: "1"
      TF_ENABLE_ONEDNN_OPTS: "0"
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "1"
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install pinned runtime and developer tools
        run: python -m pip install -r requirements-runtime.txt -r requirements-dev.txt -e .
      - run: python -m pip check
      - name: Tests including subprocess CLI integration
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Combine process coverage
        if: always()
        run: python -m coverage combine
      - name: Coverage JSON
        if: always()
        run: python -m coverage json -o coverage.json
      - name: Coverage XML
        if: always()
        run: python -m coverage xml -o coverage.xml
      - name: Enforce coverage floor
        if: always()
        run: python -m coverage report --fail-under=85
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py312
          path: |
            coverage.json
            coverage.xml
          if-no-files-found: error
          retention-days: 14

  source-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install source-build and demo dependencies
        run: python -m pip install build==1.6.1 Pillow==12.0.0
      - name: Build source distribution
        run: python -m build --sdist
      - name: Verify included inputs and run the extracted demo
        run: python tools/check_source_distribution.py dist/face_mask_detection-2.0.0.tar.gz
