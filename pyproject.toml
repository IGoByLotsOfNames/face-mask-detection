[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mask-detection"
version = "2.0.0"
description = "Binary image research pipeline with validated split and model contracts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Jirapas Wongtreenatrkoon"}]
dependencies = ["numpy>=2,<2.3", "Pillow>=12,<13"]

[project.optional-dependencies]
runtime = ["tensorflow==2.20.0", "keras==3.15.1", "opencv-python==4.12.0.88"]

[tool.setuptools.packages.find]
where = ["src"]
