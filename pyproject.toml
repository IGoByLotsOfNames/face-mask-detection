[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-mask-detection"
version = "2.0.0"
description = "Categorical and legacy binary image research pipeline with validated data and model contracts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Jirapas Wongtreenatrkoon"}]
dependencies = ["numpy>=2,<2.3", "Pillow>=12,<13"]

[project.optional-dependencies]
runtime = ["tensorflow==2.20.0", "keras==3.15.1", "opencv-python==4.12.0.88"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["docs/evidence/baseline-data.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["mask_detection"]
relative_files = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 85
